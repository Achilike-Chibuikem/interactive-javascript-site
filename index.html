<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICT Equipment Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ICT Equipment Dashboard</h1>

  <!-- Counters -->
  <div class="counters">
    <div class="counter">Total: <span id="total">0</span></div>
    <div class="counter green">Working: <span id="working">0</span></div>
    <div class="counter orange">Maintenance: <span id="maintenance">0</span></div>
    <div class="counter red">Faulty: <span id="faulty">0</span></div>
  </div>

  <!-- Search and filters -->
  <div class="filters">
    <input type="text" id="search" placeholder="Search by name...">

    <select id="categoryFilter">
      <option value="All">All categories</option>
      <option value="Computer">Computer</option>
      <option value="Printer">Printer</option>
      <option value="Network">Network</option>
      <option value="Other">Other</option>
    </select>

    <select id="statusFilter">
      <option value="All">All statuses</option>
      <option value="Working">Working</option>
      <option value="Under Maintenance">Under Maintenance</option>
      <option value="Faulty">Faulty</option>
    </select>
  </div>

  <!-- Equipment cards appear here -->
  <div id="equipmentList"></div>

  <!-- Add equipment form -->
  <h2>Add New Equipment</h2>
  <div class="form-box">
    <input type="text" id="nameInput" placeholder="Equipment name">

    <select id="categoryInput">
      <option value="">-- Choose category --</option>
      <option value="Computer">Computer</option>
      <option value="Printer">Printer</option>
      <option value="Network">Network</option>
      <option value="Other">Other</option>
    </select>

    <select id="statusInput">
      <option value="Working">Working</option>
      <option value="Under Maintenance">Under Maintenance</option>
      <option value="Faulty">Faulty</option>
    </select>

    <label>Next maintenance date:</label>
    <input type="date" id="dateInput">

    <p id="errorMessage"></p>
    <button onclick="addEquipment()">Add Equipment</button>
  </div>

  <!-- Details popup (hidden until a card is clicked) -->
  <div id="modal" class="hidden">
    <div class="modal-box">
      <h2 id="modalName"></h2>
      <p id="modalCategory"></p>
      <p id="modalStatus"></p>
      <p id="modalDate"></p>

      <label>Change status:</label>
      <select id="modalStatusSelect"></select>

      <br><br>
      <button id="removeButton">Remove</button>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
